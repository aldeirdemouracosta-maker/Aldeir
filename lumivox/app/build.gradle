plugins {
    id 'com.android.application'
}

// A chave de assinatura NUNCA fica no repositório: vem do ambiente (CI usa secrets; local, exporte as variáveis).
def lumivoxKeystorePath = System.getenv('LUMIVOX_KEYSTORE_PATH')

android {
    namespace 'br.com.aee.lumivox'
    compileSdk 35

    defaultConfig {
        applicationId 'br.com.aee.lumivox'
        minSdk 23
        targetSdk 35
        versionCode 1
        versionName '1.0.0'
    }

    signingConfigs {
        if (lumivoxKeystorePath) {
            release {
                storeFile file(lumivoxKeystorePath)
                storePassword System.getenv('LUMIVOX_KEYSTORE_PASSWORD')
                keyAlias System.getenv('LUMIVOX_KEY_ALIAS') ?: 'lumivox'
                keyPassword System.getenv('LUMIVOX_KEY_PASSWORD')
            }
        }
    }

    buildTypes {
        debug {
            applicationIdSuffix '.debug'
            versionNameSuffix '-debug'
        }
        release {
            minifyEnabled false
            shrinkResources false
            if (lumivoxKeystorePath) {
                signingConfig signingConfigs.release  // sem chave no ambiente, o release sai sem assinatura
            }
        }
    }
}
