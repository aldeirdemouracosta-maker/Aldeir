# Manifesto de modelos de referência (fonte: pesquisa "SWARM LITE AI — modelos sub-1 GB").
# Tamanhos e licenças vêm do PDF; sha256 está vazio de propósito: NENHUM hash foi verificado.
# O instalador exige sha256 (aqui ou em --sha256, copiado da página oficial do arquivo).
# status: wired = existe adaptador no código | planned = só referência, adaptador ainda não escrito
models:
  - id: qwen2.5-0.5b-instruct-q5_0
    agents: [chat]
    provider: llama.cpp / ollama
    url: https://huggingface.co/Qwen/Qwen2.5-0.5B-Instruct-GGUF/resolve/main/qwen2.5-0.5b-instruct-q5_0.gguf
    filename: qwen2.5-0.5b-instruct-q5_0.gguf
    sha256: null
    size_mb: 490
    license: Apache-2.0
    capabilities: [chat, summarize, translate]
    languages: [multi]
    backend: llama-server (API compatível) ou Ollama
    minimum_ram_mb: 1024
    recommended_ram_mb: 2048
    status: wired
  - id: qwen2.5-coder-0.5b-instruct-q4_k_m
