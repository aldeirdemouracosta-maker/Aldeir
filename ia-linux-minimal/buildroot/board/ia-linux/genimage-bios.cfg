image disk.img {
  hdimage {
    gpt = false
  }

  partition system {
    partition-type = 0x83
    bootable = true
    image = "system.ext4"
    size = 512M
  }

  partition recovery {
    partition-type = 0x83
    image = "recovery.ext4"
    size = 128M
  }

  # 96 GiB: dimensionado para um SSD "de 110 GB" (fabricantes usam GB
  # decimal; um disco desses reporta ~102,4 GiB reais ao SO). 96 GiB +
  # system (512M) + recovery (128M) = ~96,6 GiB, deixando ~5,7 GiB de
  # margem — cobre variação real de capacidade entre unidades e
  # overhead de partição. Ajuste este valor se o SSD de destino tiver
  # outra capacidade.
  partition data {
    partition-type = 0x83
    image = "data.ext4"
    size = 96G
  }
}
