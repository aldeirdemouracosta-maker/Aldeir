image disk.img {
  hdimage {
    gpt = false
  }

  # As duas entradas abaixo (boot/grub) embutem o código de boot do
  # GRUB diretamente no disk.img, FORA da tabela de partição
  # (in-partition-table = "no") — é isso que faz o BIOS achar código
  # executável no setor 0 (MBR) e dar boot de verdade. Sem elas,
  # genimage monta partições válidas mas nenhum código de boot — o
  # disco fica com tabela de partição correta e nada pra executar, e o
  # BIOS cai pro próximo dispositivo (confirmado num boot físico real:
  # caía pra PXE/rede, ver CHANGELOG.md). Padrão idêntico ao
  # board/pc/genimage-bios.cfg de referência do próprio Buildroot —
  # boot.img (512 bytes, 1º estágio) no setor 0, preservando os bytes
  # 440-512 (assinatura + tabela de partição, escritos pelo genimage,
  # não pelo boot.img) via "holes"; grub.img (2º estágio embutido, com
  # os módulos e o grub.cfg via BUILTIN_MODULES_PC/BUILTIN_CONFIG_PC)
  # logo em seguida, no setor 1.
  partition boot {
    in-partition-table = "no"
    image = "boot.img"
    offset = 0
    size = 512
    holes = {"(440; 512)"}
  }

  partition grub {
    in-partition-table = "no"
    image = "grub.img"
    offset = 512
  }

  # 2560 MiB: precisa caber o rootfs real gerado pelo Buildroot
  # (BR2_TARGET_ROOTFS_EXT2_SIZE=2048M no defconfig — kernel, Mesa,
  # Vulkan, llama.cpp e ai-core juntos passam de 512 MiB). Os dois
  # valores nunca tinham sido conferidos um contra o outro — só um
  # build real expôs isso ("part system size too small for
  # system.ext4", ver CHANGELOG.md). 512 MiB de margem sobre os
  # 2048 MiB reais.
  partition system {
    partition-type = 0x83
    bootable = true
    image = "system.ext4"
    size = 2560M
  }

  partition recovery {
    partition-type = 0x83
    image = "recovery.ext4"
    size = 128M
  }

  # 96 GiB: dimensionado para um SSD "de 110 GB" (fabricantes usam GB
  # decimal; um disco desses reporta ~102,4 GiB reais ao SO). 96 GiB +
  # system (2560M) + recovery (128M) = ~98,6 GiB, deixando ~3,8 GiB de
  # margem — cobre variação real de capacidade entre unidades e
  # overhead de partição. Ajuste este valor se o SSD de destino tiver
  # outra capacidade.
  partition data {
    partition-type = 0x83
    image = "data.ext4"
    size = 96G
  }
}
