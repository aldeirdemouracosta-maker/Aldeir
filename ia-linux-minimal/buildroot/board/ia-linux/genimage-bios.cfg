image disk.img {
  hdimage {
    gpt = false
  }

  partition system {
    partition-type = 0x83
    bootable = true
    image = "system.ext4"
    size = 512M
  }

  partition recovery {
    partition-type = 0x83
    image = "recovery.ext4"
    size = 128M
  }

  partition data {
    partition-type = 0x83
    image = "data.ext4"
    size = 512M
  }
}
