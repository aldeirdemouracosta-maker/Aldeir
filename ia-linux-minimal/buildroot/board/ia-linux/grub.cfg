set default=0
set timeout=2

# root é localizado por PARTUUID, não por /dev/sdaN — a ordem de detecção
# de discos no boot físico não é garantida (ver docs/architecture.md).
search --no-floppy --fs-uuid --set=root __SYSTEM_PARTUUID__

menuentry "IA Linux Minimal" {
    linux /boot/bzImage root=PARTUUID=__SYSTEM_PARTUUID__ rootfstype=ext4 ro console=tty1 console=ttyS0,115200
}

menuentry "IA Linux Minimal (recovery: sem GPU)" {
    linux /boot/bzImage root=PARTUUID=__SYSTEM_PARTUUID__ rootfstype=ext4 ro nomodeset console=tty1 console=ttyS0,115200 ia.recovery=1
}

menuentry "IA Linux Minimal (recovery: somente CPU)" {
    linux /boot/bzImage root=PARTUUID=__SYSTEM_PARTUUID__ rootfstype=ext4 ro console=tty1 ia.backend=cpu ia.recovery=1
}
