set default=0
set timeout=2

# root é localizado pelo UUID do sistema de arquivos da partição SYSTEM,
# não por /dev/sdaN — a ordem de detecção de discos no boot físico não é
# garantida (ver docs/architecture.md). O UUID abaixo é FIXO (não um
# placeholder a substituir): post-image.sh grava esse mesmo UUID no
# ext4 da partição SYSTEM via `tune2fs -U` antes de montar o disco
# final, então este arquivo e o sistema de arquivos gerado sempre
# concordam, sem precisar de um passo de template em tempo de build.
#
# Nota de correção: uma versão anterior deste arquivo usava um
# placeholder "__SYSTEM_PARTUUID__" que nenhum script jamais substituía
# (o boot físico teria travado no prompt de resgate do GRUB), e a busca
# usava "--fs-uuid" com um valor de PARTUUID — dois namespaces de UUID
# diferentes que nunca colidem. Usar um UUID de sistema de arquivos
# fixo, gerado por nós mesmos, resolve os dois problemas de uma vez.
search --no-floppy --fs-uuid --set=root 11111111-1111-4111-8111-111111111111

menuentry "IA Linux Minimal" {
    linux /boot/bzImage root=UUID=11111111-1111-4111-8111-111111111111 rootfstype=ext4 ro console=tty1 console=ttyS0,115200
}

menuentry "IA Linux Minimal (recovery: sem GPU)" {
    linux /boot/bzImage root=UUID=11111111-1111-4111-8111-111111111111 rootfstype=ext4 ro nomodeset console=tty1 console=ttyS0,115200 ia.recovery=1
}

menuentry "IA Linux Minimal (recovery: somente CPU)" {
    linux /boot/bzImage root=UUID=11111111-1111-4111-8111-111111111111 rootfstype=ext4 ro console=tty1 ia.backend=cpu ia.recovery=1
}
