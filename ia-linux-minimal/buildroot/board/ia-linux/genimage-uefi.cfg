image disk.img {
  hdimage {
    gpt = true
  }

  partition efi {
    partition-type-uuid = U
    bootable = true
    image = "efi.vfat"
    size = 64M
  }

  partition system {
    partition-type-uuid = L
    image = "system.ext4"
    size = 512M
  }

  partition recovery {
    partition-type-uuid = L
    image = "recovery.ext4"
    size = 128M
  }

  partition data {
    partition-type-uuid = L
    image = "data.ext4"
    size = 512M
  }
}
