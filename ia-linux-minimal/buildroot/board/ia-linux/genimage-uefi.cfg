# efi.vfat é CONSTRUÍDO por genimage a partir de $BINARIES_DIR/EFI
# (montado por post-image.sh, que localiza o binário BOOTX64.EFI do
# GRUB) — não é um arquivo pré-existente como system.ext4/recovery.ext4/
# data.ext4.
image efi.vfat {
  vfat {
    files = {
      "EFI"
    }
  }
  size = 64M
}

image disk.img {
  hdimage {
    gpt = true
  }

  partition efi {
    partition-type-uuid = U
    bootable = true
    image = "efi.vfat"
    size = 64M
  }

  partition system {
    partition-type-uuid = L
    image = "system.ext4"
    size = 512M
  }

  partition recovery {
    partition-type-uuid = L
    image = "recovery.ext4"
    size = 128M
  }

  partition data {
    partition-type-uuid = L
    image = "data.ext4"
    size = 512M
  }
}
