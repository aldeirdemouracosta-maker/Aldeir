# efi.vfat é CONSTRUÍDO por genimage a partir de $BINARIES_DIR/EFI
# (montado por post-image.sh, que localiza o binário BOOTX64.EFI do
# GRUB) — não é um arquivo pré-existente como system.ext4/recovery.ext4/
# data.ext4.
image efi.vfat {
  vfat {
    files = {
      "EFI"
    }
  }
  size = 64M
}

image disk.img {
  hdimage {
    gpt = true
  }

  partition efi {
    partition-type-uuid = U
    bootable = true
    image = "efi.vfat"
    size = 64M
  }

  partition system {
    partition-type-uuid = L
    image = "system.ext4"
    size = 512M
  }

  partition recovery {
    partition-type-uuid = L
    image = "recovery.ext4"
    size = 128M
  }

  # 96 GiB: dimensionado para um SSD "de 110 GB" (fabricantes usam GB
  # decimal; um disco desses reporta ~102,4 GiB reais ao SO). 96 GiB +
  # efi (64M) + system (512M) + recovery (128M) = ~96,7 GiB, deixando
  # ~5,7 GiB de margem — cobre variação real de capacidade entre
  # unidades e overhead de partição/GPT. Ajuste este valor se o SSD de
  # destino tiver outra capacidade.
  partition data {
    partition-type-uuid = L
    image = "data.ext4"
    size = 96G
  }
}
