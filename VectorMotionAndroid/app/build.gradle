plugins {
    id 'com.android.application'
}

// Troca de rosto (MediaPipe) é opcional: ./gradlew assembleDebug -PfaceSwap=true
def faceSwap = (project.findProperty('faceSwap') ?: 'false') != 'false'

android {
    namespace 'app.vectormotion.studio'
    compileSdk 36

    defaultConfig {
        applicationId 'app.vectormotion.studio'
        minSdk 29        // Android 10
        targetSdk 36     // Android 16; continua instalando a partir do Android 10
        versionCode 1
        versionName '0.1.0'
        ndk { abiFilters 'arm64-v8a', 'armeabi-v7a', 'x86_64' }
        externalNativeBuild { cmake { arguments '-DANDROID_STL=c++_static' } }
    }

    externalNativeBuild {
        cmake {
            path 'src/main/cpp/CMakeLists.txt'
            version '3.22.1'
        }
    }

    // Assinatura de release só se as variáveis existirem; senão usa a chave de
    // debug (APK instalável, mas não publicável na Play Store).
    signingConfigs {
        release {
            def ks = System.getenv('VM_KEYSTORE')
            if (ks) {
                storeFile file(ks)
                storePassword System.getenv('VM_KEYSTORE_PASSWORD')
                keyAlias System.getenv('VM_KEY_ALIAS')
                keyPassword System.getenv('VM_KEY_PASSWORD')
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            signingConfig System.getenv('VM_KEYSTORE') ? signingConfigs.release : signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    lint { abortOnError false }

    sourceSets {
        main.java.srcDirs += faceSwap ? 'src/face/java' : 'src/noface/java'
    }
}

dependencies {
    if (faceSwap) {
        // Detecção de pontos do rosto no aparelho. Modelo: app/src/main/assets/face_landmarker.task (tools/fetch_face_model.sh)
        implementation 'com.google.mediapipe:tasks-vision:0.10.14'
    }
}
