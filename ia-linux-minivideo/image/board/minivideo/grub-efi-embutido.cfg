# Embutido no BOOTX64.EFI (grub-mkimage -c). O GRUB EFI começa dentro da
# imagem FAT do El Torito/ESP; aqui ele acha o próprio ISO9660 (em CD ou em
# pendrive) pelo arquivo-marca e carrega o menu de lá.
search --no-floppy --set=root --file /boot/minivideo-uefi.id
set prefix=($root)/boot/grub
configfile /boot/grub/grub.cfg
