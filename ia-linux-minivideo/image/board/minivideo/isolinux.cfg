UI menu.c32
PROMPT 0
TIMEOUT 50
DEFAULT minivideo
MENU TITLE IA-Linux MiniVideo

LABEL minivideo
      MENU LABEL IA-Linux MiniVideo (RX 580 / Vulkan)
      KERNEL __KERNEL_PATH__
      INITRD __INITRD_PATH__
      APPEND console=tty1 quiet loglevel=3

LABEL toram
      MENU LABEL IA-Linux MiniVideo - carregar tudo na RAM (pode tirar o pendrive)
      KERNEL __KERNEL_PATH__
      INITRD __INITRD_PATH__
      APPEND console=tty1 quiet loglevel=3 minivideo.toram=1

LABEL semgpu
      MENU LABEL Recuperacao: sem GPU (nomodeset)
      KERNEL __KERNEL_PATH__
      INITRD __INITRD_PATH__
      APPEND console=tty1 nomodeset minivideo.recuperacao=1

LABEL serial
      MENU LABEL Diagnostico: console serial + tela
      KERNEL __KERNEL_PATH__
      INITRD __INITRD_PATH__
      APPEND console=ttyS0,115200 console=tty1 loglevel=7
