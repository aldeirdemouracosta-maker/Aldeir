[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "ia-linux-minivideo-tools"
version = "0.1.0"
description = "IA-Linux MiniVideo: auditoria de máquina e Hardware Safety Guard (somente leitura)"
requires-python = ">=3.9"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
minivideo-audit = "minivideo_audit.audit:main"
minivideo-guard = "minivideo_guard.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
