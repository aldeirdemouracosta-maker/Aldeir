[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "ia-linux-minivideo-tools"
version = "0.3.0"
description = "IA-Linux MiniVideo: agentes locais de vídeo, interface de pastas, auditoria e Hardware Safety Guard"
requires-python = ">=3.9"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7", "pyte>=0.8"]

[project.scripts]
minivideo-audit = "minivideo_audit.audit:main"
minivideo-guard = "minivideo_guard.cli:main"
minivideo-agentes = "minivideo_agents.cli:main"
minivideo-ui = "minivideo_ui.app:main"
minivideo-modelos = "minivideo_modelos.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
minivideo_especialistas = ["schemas/*.json"]
minivideo_modelos = ["catalogo.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
