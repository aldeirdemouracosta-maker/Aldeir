workflows:
  android-debug:
    name: Lumivox Android Debug APK
    max_build_duration: 30
    environment:
      java: 17
    scripts:
      - name: Build debug APK
        script: |
          cd lumivox && gradle :app:assembleDebug --stacktrace
    artifacts:
      - lumivox/app/build/outputs/apk/debug/*.apk
