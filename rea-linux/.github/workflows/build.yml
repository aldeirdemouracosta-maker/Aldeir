name: Build ISO
on:
  workflow_dispatch:
  push:
    branches: [main]
jobs:
  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get install -y shellcheck
      - run: shellcheck -x build.sh auto/* config/hooks/normal/* config/includes.chroot/usr/local/bin/*
      - run: pipx run ruff check config/includes.chroot/usr/local/lib/rea/painel.py
  iso:
    needs: lint
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
      - name: Liberar disco
        run: sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android
      - run: sudo ./build.sh
      - name: Boot de fumaca no QEMU (serial, sem interface)
        run: |
          sudo apt-get install -y qemu-system-x86
          timeout 240 qemu-system-x86_64 -m 4G -smp 2 -nographic -cdrom rea-linux-*.iso -serial mon:stdio 2>&1 | tee boot.log || true
          grep -qiE "login:|Reached target|Started Ollama" boot.log
      - uses: actions/upload-artifact@v4
        with:
          name: rea-linux-iso
          path: |
            rea-linux-*.iso
            rea-linux-*.iso.sha256
            build.log
