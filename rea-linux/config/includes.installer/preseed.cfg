# Respostas padrao do instalador (Debian Installer) do REA Linux.
# O instalador ainda pergunta disco e senha; o resto ja vem preenchido.
d-i debian-installer/locale string pt_BR.UTF-8
d-i keyboard-configuration/xkb-keymap select br
d-i time/zone string America/Sao_Paulo
d-i clock-setup/utc boolean true
d-i netcfg/get_hostname string rea-linux
d-i netcfg/get_domain string local

# Usuario "rea" (o login automatico e a interface usam esse nome)
d-i passwd/root-login boolean false
d-i passwd/user-fullname string REA
d-i passwd/username string rea

d-i apt-setup/non-free-firmware boolean true
d-i apt-setup/non-free boolean true
d-i apt-setup/contrib boolean true
popularity-contest popularity-contest/participate boolean false
