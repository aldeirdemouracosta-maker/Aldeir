### CircuitForge – LLaMA-Factory (LoRA) para eletrônica
### Gere o dataset antes:  python finetune/build_dataset.py
### Rode a partir de finetune/llamafactory:  llamafactory-cli train electronics_lora.yaml
### (não executado no ambiente de desenvolvimento – exige GPU)

model_name_or_path: Qwen/Qwen2.5-1.5B-Instruct      # leve: Qwen/Qwen2.5-0.5B-Instruct
trust_remote_code: true

stage: sft
do_train: true
finetuning_type: lora
lora_target: all
lora_rank: 16
lora_alpha: 32
lora_dropout: 0.05

dataset_dir: ../dataset
dataset: electronics_sft
template: qwen
cutoff_len: 3072
max_samples: 5000
overwrite_cache: true
preprocessing_num_workers: 4

output_dir: ./electronics-lora-lf
logging_steps: 5
save_steps: 100
plot_loss: true
overwrite_output_dir: true

per_device_train_batch_size: 2
gradient_accumulation_steps: 4
learning_rate: 2.0e-4
num_train_epochs: 3.0
lr_scheduler_type: cosine
warmup_ratio: 0.05
bf16: true
ddp_timeout: 180000000

val_size: 0.05
per_device_eval_batch_size: 2
eval_strategy: steps
eval_steps: 100
