### CircuitForge – Configuração LLaMA-Factory para fine-tune de eletrônica
### Modelo leve (< 1B) + LoRA / QLoRA
###
### Como usar:
###   1. Instale: pip install "llamafactory[torch,metrics]"
###      ou: git clone https://github.com/hiyouga/LLaMA-Factory && cd LLaMA-Factory && pip install -e .
###   2. Coloque este YAML em LLaMA-Factory/examples/ ou rode:
###        llamafactory-cli train electronics_lora.yaml
###   3. Ou use a WebUI: llamafactory-cli webui
###      e carregue este arquivo.

### Model
model_name_or_path: Qwen/Qwen2-0.5B-Instruct
# Alternativas leves:
# model_name_or_path: TinyLlama/TinyLlama-1.1B-Chat-v1.0
# model_name_or_path: meta-llama/Llama-3.2-1B-Instruct

trust_remote_code: true

### Method
stage: sft
do_train: true
finetuning_type: lora
lora_target: all
lora_rank: 16
lora_alpha: 32
lora_dropout: 0.05

### Dataset
dataset_dir: ../dataset
dataset: electronics_sft          # nome do arquivo sem .jsonl (ou registre no dataset_info.json)
template: qwen                    # ou llama3 / tinyllama conforme o modelo
cutoff_len: 2048
max_samples: 1000
overwrite_cache: true
preprocessing_num_workers: 4

### Output
output_dir: ./electronics-lora-lf
logging_steps: 5
save_steps: 50
plot_loss: true
overwrite_output_dir: true

### Train
per_device_train_batch_size: 2
gradient_accumulation_steps: 4
learning_rate: 2.0e-4
num_train_epochs: 3.0
lr_scheduler_type: cosine
warmup_ratio: 0.1
bf16: true
# fp16: true          # use se a GPU não tiver bf16
ddp_timeout: 180000000

### Eval (opcional)
# val_size: 0.1
# per_device_eval_batch_size: 2
# eval_strategy: steps
# eval_steps: 50
