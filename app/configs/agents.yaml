# Modelos são referências históricas; o usuário decide o que instalar.
agents:
  chat:
    enabled: true
    model: qwen2.5:0.5b
  coder:
    enabled: true
    model: qwen2.5-coder:0.5b
  planner:
    enabled: true
    model: qwen2.5:0.5b   # 0.5B segue JSON com dificuldade; plan_run aceita passos escritos à mão
