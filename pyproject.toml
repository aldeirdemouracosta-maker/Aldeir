[project]
name = "swarm-lite-ai"
version = "0.1.0"
description = "Reconstrução do MICROAGENTS AI: agentes locais minimalistas e supervisionados."
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.110",
  "uvicorn>=0.29",
  "httpx>=0.27",
  "pyyaml>=6.0",
  "typer>=0.12",
  "rich>=13",
  "psutil>=5.9",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

# Backends opcionais (pesos NÃO incluídos; o projeto nunca baixa modelos sozinho). Sem versões fixadas: não verificadas.
vision = ["transformers", "torch", "pillow"]
speech = ["faster-whisper"]
voice = ["kokoro-onnx"]
ocr = ["paddleocr"]
retrieval = ["transformers", "torch", "pillow"]

[project.scripts]
swarm = "app.cli.main:app"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.setuptools.package-data]
"app.dashboard" = ["static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
