[project]
name = "swarm-lite-ai"
version = "0.1.0"
description = "Reconstrução do MICROAGENTS AI: agentes locais minimalistas e supervisionados."
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.110",
  "uvicorn>=0.29",
  "httpx>=0.27",
  "pyyaml>=6.0",
  "typer>=0.12",
  "rich>=13",
  "psutil>=5.9",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff", "pypdf", "mammoth"]  # pypdf+mammoth (2,3 MB) deixam os testes de PDF/DOCX rodarem no CI

# Backends opcionais (pesos NÃO incluídos; o projeto nunca baixa modelos sozinho). Sem versões fixadas: não verificadas.
docs = ["pypdf", "mammoth"]  # PDF e DOCX no RAG (leves; o MarkItDown trouxe 193 MB e foi descartado)
vision = ["transformers", "torch", "pillow"]
speech = ["faster-whisper"]
voice = ["kokoro-onnx"]
ocr = ["paddleocr"]
retrieval = ["transformers", "torch", "pillow"]

[project.scripts]
swarm = "app.cli.main:app"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.setuptools.package-data]
"app" = ["configs/*.yaml", "evals/*.yaml"]
"app.dashboard" = ["static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 120
extend-exclude = ["lumivox", "MagicSlides", "build"]

[tool.ruff.lint]
# Só o que acha erro de verdade: pyflakes (F), bugbear (B), modernização (UP), erros graves (E7/E9).
# Estilo (E702 ponto-e-vírgula, E731 lambda, E741) fica de fora de propósito: o código é enxuto e os testes são terse.
select = ["F", "B", "UP", "E7", "E9"]
ignore = ["E702", "E731", "E741"]
