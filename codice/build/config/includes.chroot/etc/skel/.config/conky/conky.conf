-- Painel do Codice: so dados REAIS (nada decorativo).
conky.config = {
  alignment = 'top_right', gap_x = 16, gap_y = 16, minimum_width = 300, maximum_width = 300,
  update_interval = 2, double_buffer = true, own_window = true, own_window_type = 'desktop',
  own_window_transparent = false, own_window_argb_visual = true, own_window_argb_value = 170,
  own_window_colour = '000000', own_window_hints = 'undecorated,below,sticky,skip_taskbar,skip_pager',
  use_xft = true, font = 'DejaVu Sans Mono:size=9', draw_borders = true, border_width = 1,
  default_outline_color = '00ff41', default_color = 'b6ffc8', color1 = '00ff41', color2 = '00e5ff',
  color3 = 'ff4d4d', border_inner_margin = 10, draw_shades = false, draw_outline = false,
}
conky.text = [[
${color1}${font DejaVu Sans Mono:bold:size=11}CODICE${font}${color}   ${alignr}${time %H:%M:%S}
${color2}KERNEL${color} ${alignr}${kernel}
${hr}
${color1}CPU${color} ${cpu cpu0}% ${alignr}${cpubar cpu0 6,150}
${color1}RAM${color} ${mem}/${memmax} ${alignr}${membar 6,150}
${color1}ZRAM${color} ${alignr}${swap}/${swapmax}
${hr}
${color2}GPU${color} ${execi 3 cat /sys/class/drm/card*/device/gpu_busy_percent 2>/dev/null | head -1}% ${alignr}VRAM ${execi 3 awk '{printf "%.1f", $1/1073741824}' /sys/class/drm/card*/device/mem_info_vram_used 2>/dev/null | head -c 6} GB
${hr}
${color2}IA LOCAL${color}  ${alignr}${if_match "${execi 5 codice-estado llama}" == "on"}${color1}llama-server ONLINE${else}${color3}llama-server OFF${endif}${color}
${color2}MODELO${color} ${alignr}${execi 30 ls /models/*.gguf 2>/dev/null | head -1 | xargs -r basename}
${color2}PROXY${color}  ${alignr}${if_match "${execi 5 codice-estado proxy}" == "on"}${color1}ONLINE${else}${color3}OFF${endif}${color}
${hr}
${color2}FIREWALL${color} ${alignr}${if_match "${execi 10 codice-estado firewall}" == "on"}${color1}ON${else}${color3}OFF${endif}${color}
${color2}REDE${color} ${alignr}down ${downspeed ${gw_iface}}  up ${upspeed ${gw_iface}}
]]
