name: Testes

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar bubblewrap (sandbox_execucao) e libs do Qt (interface)
        run: |
          sudo apt-get update
          sudo apt-get install -y bubblewrap libegl1 libxkbcommon0 libxcb-cursor0 libgl1 libdbus-1-3 libfontconfig1

      - name: Permitir userns não privilegiado para o bwrap (restrição AppArmor do Ubuntu 24.04)
        run: |
          if command -v apparmor_parser >/dev/null 2>&1; then
            sudo tee /etc/apparmor.d/bwrap >/dev/null <<'EOF'
          abi <abi/4.0>,
          include <tunables/global>

          profile bwrap /usr/bin/bwrap flags=(unconfined) {
            userns,
            include if exists <local/bwrap>
          }
          EOF
            sudo apparmor_parser -r /etc/apparmor.d/bwrap
          fi

      - name: Instalar dependências
        run: pip install -r requirements.txt -r requirements-dev.txt

      - name: Rodar suíte de testes
        run: python3 -m pytest -v
        env:
          QT_QPA_PLATFORM: offscreen
