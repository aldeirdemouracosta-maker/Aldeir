name: IAVOX - testes

on:
  workflow_dispatch:
  push:
    paths: [ "iavox/**", ".github/workflows/iavox-testes.yml" ]

jobs:
  testes:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: iavox
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Ferramentas do sistema (voz, OCR, Qt sem monitor)
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q espeak-ng tesseract-ocr tesseract-ocr-por poppler-utils \
            libegl1 libxkbcommon0 libdbus-1-3 libfontconfig1

      - name: Dependências Python
        run: pip install -r requirements.txt -r requirements-gui.txt pytest reportlab

      - name: Testes (módulos + interface pelo teclado)
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m pytest tests/ -v
