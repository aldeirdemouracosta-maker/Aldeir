name: Gerar APK Lumivox Android

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]
    paths: [ 'lumivox/**', '.github/workflows/build-lumivox-apk.yml' ]

jobs:
  build-apk:
    name: Validar e compilar APK Android
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: lumivox
    env:
      # true só quando o secret existe (PRs de forks não recebem secrets: nesse caso só o APK debug é gerado)
      HAS_KEYSTORE: ${{ secrets.LUMIVOX_KEYSTORE_BASE64 != '' }}

    steps:
      - name: Baixar código do repositório
        uses: actions/checkout@v7

      - name: Configurar Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.10.2'
          cache-provider: basic

      - name: Validar estrutura do Lumivox
        run: |
          test -f settings.gradle
          test -f build.gradle
          test -f app/build.gradle
          test -f app/src/main/AndroidManifest.xml
          test -f app/src/main/java/br/com/aee/lumivox/MainActivity.java
          test -f app/src/main/assets/www/index.html
          test -f app/src/main/assets/www/app.js
          test -f app/src/main/assets/www/style.css
          test -f app/src/main/res/values/strings.xml
          grep -q 'LumivoxAndroid' app/src/main/assets/www/app.js
          grep -q 'TextToSpeech' app/src/main/java/br/com/aee/lumivox/MainActivity.java
          grep -q 'android.intent.action.MAIN' app/src/main/AndroidManifest.xml
          grep -q 'assembleRelease' build_apk_debug.sh || true

      - name: Conferir SDK Android
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          ls "$ANDROID_HOME/platforms" | tail -n 10 || true

      - name: Preparar chave de assinatura (a partir dos secrets; nunca vem do Git)
        if: env.HAS_KEYSTORE == 'true'
        env:
          LUMIVOX_KEYSTORE_BASE64: ${{ secrets.LUMIVOX_KEYSTORE_BASE64 }}
        run: |
          umask 077
          echo "$LUMIVOX_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/lumivox-release.p12"

      - name: Compilar APK debug e release assinado
        if: env.HAS_KEYSTORE == 'true'
        env:
          LUMIVOX_KEYSTORE_PATH: ${{ runner.temp }}/lumivox-release.p12
          LUMIVOX_KEYSTORE_PASSWORD: ${{ secrets.LUMIVOX_KEYSTORE_PASSWORD }}
          LUMIVOX_KEY_PASSWORD: ${{ secrets.LUMIVOX_KEY_PASSWORD }}
          LUMIVOX_KEY_ALIAS: ${{ secrets.LUMIVOX_KEY_ALIAS }}
        run: |
          gradle :app:assembleDebug :app:assembleRelease --stacktrace

      - name: Compilar somente APK debug (secrets de assinatura ausentes)
        if: env.HAS_KEYSTORE != 'true'
        run: |
          echo "::notice::Secrets de assinatura ausentes: gerando apenas o APK debug."
          gradle :app:assembleDebug --stacktrace

      - name: Apagar a chave temporária
        if: always()
        run: rm -f "$RUNNER_TEMP/lumivox-release.p12"

      - name: Renomear APKs
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/debug/*.apk dist/Lumivox-Android-debug.apk
          if [ "$HAS_KEYSTORE" = "true" ]; then
            cp app/build/outputs/apk/release/*.apk dist/Lumivox-Android-release-assinado.apk
          fi
          ls -lh dist

      - name: Enviar APKs para download
        uses: actions/upload-artifact@v4
        with:
          name: Lumivox-Android-APK
          path: lumivox/dist/*.apk
          retention-days: 14
