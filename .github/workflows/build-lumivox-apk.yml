name: Gerar APK Lumivox Android

on:
  workflow_dispatch:
    inputs:
      emulator:
        description: "Também testar o app num Android virtual (emulador)"
        type: boolean
        default: false
  push:
    branches: [ main, master ]
    paths:
      - "Lumivox/**"
      - ".github/workflows/build-lumivox-apk.yml"

jobs:
  build-apk:
    name: Validar e compilar APK Android
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: Lumivox

    steps:
      - name: Baixar código do repositório
        uses: actions/checkout@v7

      - name: Configurar Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.10.2'
          cache-provider: basic

      - name: Validar estrutura do Lumivox
        run: |
          test -f settings.gradle
          test -f build.gradle
          test -f app/build.gradle
          test -f app/src/main/AndroidManifest.xml
          test -f app/src/main/java/br/com/aee/lumivox/MainActivity.java
          test -f app/src/main/assets/www/index.html
          test -f app/src/main/assets/www/app.js
          test -f app/src/main/assets/www/style.css
          test -f app/src/main/res/values/strings.xml
          test -f app/release/lumivox-release.keystore
          grep -q 'LumivoxAndroid' app/src/main/assets/www/app.js
          grep -q 'TextToSpeech' app/src/main/java/br/com/aee/lumivox/MainActivity.java
          grep -q 'android.intent.action.MAIN' app/src/main/AndroidManifest.xml
          grep -q 'assembleRelease' build_apk_debug.sh || true

      - name: Conferir SDK Android
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          ls "$ANDROID_HOME/platforms" | tail -n 10 || true

      - name: Compilar APK debug e release assinado
        run: |
          gradle :app:assembleDebug :app:assembleRelease --stacktrace

      - name: Renomear APKs
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/debug/*.apk dist/Lumivox-Android-debug.apk
          cp app/build/outputs/apk/release/*.apk dist/Lumivox-Android-release-assinado.apk
          ls -lh dist

      - name: Enviar APKs para download
        uses: actions/upload-artifact@v4
        with:
          name: Lumivox-Android-APK
          path: Lumivox/dist/*.apk
          retention-days: 14

  emulator-test:
    name: Testar no Android virtual (emulador)
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.emulator }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read

    steps:
      - name: Baixar código do repositório
        uses: actions/checkout@v7

      - name: Configurar Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.10.2'
          cache-provider: basic

      - name: Compilar APK debug
        working-directory: Lumivox
        run: gradle :app:assembleDebug --stacktrace

      - name: Ativar KVM (aceleração do emulador)
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Rodar o app no emulador e testar
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          disable-animations: true
          script: bash Lumivox/ci/emulator_test.sh

      - name: Enviar capturas de tela e logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Lumivox-teste-emulador
          path: emulator-out/
          retention-days: 14
          if-no-files-found: ignore
